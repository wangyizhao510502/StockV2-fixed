name: Build StockV2 (fixed) for TrafficMonitor

on:
  workflow_dispatch:
  push:
    branches: [ master, main ]

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache wxWidgets
        id: cache-wx
        uses: actions/cache@v4
        with:
          path: C:\wx\lib\vc_x64_lib
          key: wxwidgets-3.2.10-lib-x64-v143-pcre2-md-v2

      - name: Clone wxWidgets (with submodules)
        shell: cmd
        run: |
          if not exist C:\wx\include\wx\wx.h (
            if exist C:\wx (
              echo C:\wx exists but is incomplete, removing before clone
              rmdir /s /q C:\wx
            )
            git clone --branch v3.2.10 --depth 1 --recurse-submodules https://github.com/wxWidgets/wxWidgets.git C:\wx
          ) else (
            echo wxWidgets already exists, skipping clone
          )

      - name: Build wxWidgets
        if: steps.cache-wx.outputs.cache-hit != 'true'
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          cd /d C:\wx\build\msw
          nmake -f makefile.vc BUILD=release SHARED=0 RUNTIME_LIBRARY=dynamic TARGET_CPU=x64

      - name: Set WXWIN
        shell: bash
        run: echo "WXWIN=C:\wx" >> "$GITHUB_ENV"

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build StockV2
        shell: cmd
        run: |
          msbuild TrafficMonitorPlugins.sln /p:Configuration=Release /p:Platform=x64 /t:StockV2 /restore /v:minimal

      - name: Collect artifacts
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $sv = Get-ChildItem -Path . -Recurse -Filter StockV2.dll | Where-Object { $_.Extension -eq '.dll' } | Select-Object -First 1
          if ($sv) { Copy-Item $sv.FullName dist\StockV2_x64.dll; Write-Host "copied $($sv.FullName)" } else { Write-Host "WARNING: StockV2.dll not found" }
          $wv = Get-ChildItem -Path . -Recurse -Filter WebView2Loader.dll | Where-Object { $_.Extension -eq '.dll' } | Select-Object -First 1
          if ($wv) { Copy-Item $wv.FullName dist\WebView2Loader.dll; Write-Host "copied $($wv.FullName)" } else { Write-Host "WARNING: WebView2Loader.dll not found" }
          Get-ChildItem dist | Format-Table Name, Length

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: StockV2_fixed_x64
          path: dist/*
          if-no-files-found: warn
